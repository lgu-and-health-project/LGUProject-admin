name: Deploy tenant-server

on:
  workflow_dispatch:
  push:
    branches: [develop]
    paths:
      - "apps/tenant-api/**"
      - "apps/tenant-dashboard/**"
      - "packages/**" # shared workspace packages, if any
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/deploy-tenant-server.yml"
    tags:
      - "tenant-v*.*.*"

concurrency:
  group: tenant-server-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    # staging on develop pushes, production only on tenant-v* tags.
    # GitHub resolves this dynamically per run — production requires
    # manual approval configured on the "production" Environment itself
    # (Settings -> Environments -> production -> required reviewers).
    environment: ${{ startsWith(github.ref, 'refs/tags/tenant-v') && 'production' || 'staging' }}
    steps:
      - uses: actions/checkout@v4

      - name: Set image tag
        id: tag
        run: |
          if [[ "${{ github.ref }}" == refs/tags/tenant-v* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/tenant-v}" >> "$GITHUB_OUTPUT"
            echo "stable=true" >> "$GITHUB_OUTPUT"
          else
            echo "tag=preview-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
            echo "stable=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GH_PAT }}

      # Dockerfile itself must implement the pnpm prune + multi-stage
      # copy pattern so admin-api source never lands in this image,
      # even though build context is the repo root.
      - name: Build and push tenant-api
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/tenant-api/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/tenant-api:${{ steps.tag.outputs.tag }}
            ${{ steps.tag.outputs.stable == 'true' && format('ghcr.io/{0}/tenant-api:stable', github.repository_owner) || '' }}
            ${{ steps.tag.outputs.stable == 'false' && format('ghcr.io/{0}/tenant-api:develop', github.repository_owner) || '' }}

      - name: Build and push tenant-dashboard
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/tenant-dashboard/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/tenant-dashboard:${{ steps.tag.outputs.tag }}
            ${{ steps.tag.outputs.stable == 'true' && format('ghcr.io/{0}/tenant-dashboard:stable', github.repository_owner) || '' }}
            ${{ steps.tag.outputs.stable == 'false' && format('ghcr.io/{0}/tenant-dashboard:develop', github.repository_owner) || '' }}

      - name: Trigger live deploy
        run: curl -X POST "${{ secrets.DEPLOY_HOOK_URL }}"
