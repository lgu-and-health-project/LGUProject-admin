name: Deploy admin-server

on:
  workflow_dispatch:
  push:
    branches: [develop]
    paths:
      - "apps/admin-api/**"
      - "apps/admin-dashboard/**"
      - "packages/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/deploy-admin-server.yml"
    tags:
      - "admin-v*.*.*"

concurrency:
  group: admin-server-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    environment: ${{ startsWith(github.ref, 'refs/tags/admin-v') && 'production' || 'staging' }}
    steps:
      - uses: actions/checkout@v4

      - name: Set image tag
        id: tag
        run: |
          if [[ "${{ github.ref }}" == refs/tags/admin-v* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/admin-v}" >> "$GITHUB_OUTPUT"
            echo "stable=true" >> "$GITHUB_OUTPUT"
          else
            echo "tag=preview-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
            echo "stable=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GH_PAT }}

      - name: Build and push admin-api
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/admin-api/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/admin-api:${{ steps.tag.outputs.tag }}
            ${{ steps.tag.outputs.stable == 'true' && format('ghcr.io/{0}/admin-api:stable', github.repository_owner) || '' }}
            ${{ steps.tag.outputs.stable == 'false' && format('ghcr.io/{0}/admin-api:develop', github.repository_owner) || '' }}

      - name: Build and push admin-dashboard
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/admin-dashboard/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/admin-dashboard:${{ steps.tag.outputs.tag }}
            ${{ steps.tag.outputs.stable == 'true' && format('ghcr.io/{0}/admin-dashboard:stable', github.repository_owner) || '' }}
            ${{ steps.tag.outputs.stable == 'false' && format('ghcr.io/{0}/admin-dashboard:develop', github.repository_owner) || '' }}

      # admin-api is cloud-hosted continuously, unlike tenant-server —
      # worth an explicit deploy step here once you pick a host (Render,
      # Fly, your own VM).
      - name: Trigger live deploy
        run: curl -X POST "${{ secrets.DEPLOY_HOOK_URL }}"
