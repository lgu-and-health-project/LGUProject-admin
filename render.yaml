services:
  # The Admin Backend API
  - type: web
    name: admin-api
    env: node
    rootDir: apps/admin-api
    buildCommand: pnpm install && pnpm prisma generate && pnpm prisma db push --force-reset && pnpm build
    startCommand: pnpm start:prod
    envVars:
      - key: NODE_VERSION
        value: 20.x
      - key: DATABASE_URL
        sync: false # Set this manually in Render dashboard
      - key: JWT_SECRET
        generateValue: true
      - key: INITIAL_SUPERADMIN_EMAIL
        sync: false
      - key: INITIAL_SUPERADMIN_PASSWORD
        sync: false
      - key: FRONTEND_URL
        sync: false # Set this to the deployed dashboard URL once it's up

  # The Admin Dashboard Frontend
  - type: web
    name: admin-dashboard
    env: node
    rootDir: apps/admin-dashboard
    buildCommand: pnpm install && pnpm build
    startCommand: pnpm start
    envVars:
      - key: NODE_VERSION
        value: 20.x
      - key: NEXT_PUBLIC_API_URL
        sync: false # Set this to the deployed admin-api URL
      - key: MOCK_BACKEND_URL
        fromService:
          type: web
          name: mock-backend
          envVarKey: RENDER_EXTERNAL_URL

  # Temporary Mock Backend for Testing/Simulation Swagger and API
  - type: web
    name: mock-backend
    env: node
    rootDir: apps/mock-backend
    buildCommand: pnpm install && pnpm prisma generate
    startCommand: pnpm start
    envVars:
      - key: NODE_VERSION
        value: 20.x
      - key: DATABASE_URL
        fromDatabase:
          name: tenant-db
          property: connectionString

  # Temporary Cloud-Hosted Tenant API for Testing/Simulation
  - type: web
    name: tenant-api
    env: node
    rootDir: apps/tenant-api
    buildCommand: pnpm install && pnpm prisma generate && pnpm prisma db push --force-reset && pnpm build
    startCommand: pnpm start:prod
    envVars:
      - key: NODE_VERSION
        value: 20.x
      - key: DATABASE_URL
        fromDatabase:
          name: tenant-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_API_URL
        fromService:
          type: web
          name: admin-api
          envVarKey: RENDER_EXTERNAL_URL
      - key: DEVICE_REGISTRATION_KEY
        sync: false # Set manually if simulating a pre-registered machine

databases:
  # Temporary Cloud Database for Tenant API Simulation
  - name: tenant-db
    plan: free # Change if needed
