version: '3.8'

services:
  tenant-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: mysecretpassword
      POSTGRES_DB: lgu_tenant
    ports:
      - "5433:5432"
    volumes:
      - tenant_pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  tenant-api:
    build:
      context: .
      dockerfile: apps/tenant-api/Dockerfile
    environment:
      - DATABASE_URL=postgresql://postgres:mysecretpassword@tenant-db:5432/lgu_tenant?schema=public
      - JWT_SECRET=supersecretjwtkey123
      - ADMIN_API_URL=https://admin.your-lgu-platform.com
      - PORT=4001
    ports:
      - "4001:4001"
    depends_on:
      - tenant-db
    restart: unless-stopped

  tenant-dashboard:
    build:
      context: .
      dockerfile: apps/tenant-dashboard/Dockerfile
    environment:
      - NEXT_PUBLIC_API_URL=http://<REPLACE_WITH_LOCAL_IP>:4001
    ports:
      - "3001:80"
    depends_on:
      - tenant-api
    restart: unless-stopped

volumes:
  tenant_pgdata:
